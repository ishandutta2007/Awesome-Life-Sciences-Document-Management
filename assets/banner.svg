<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b1329"/><stop offset="50%" stop-color="#101f42"/><stop offset="100%" stop-color="#070d1e"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="dnaGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#7f00ff"/><stop offset="100%" stop-color="#e100ff"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter></defs><style>@keyframes dnaRotate{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulseGlow{0%{opacity:.4}50%{opacity:.8}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.dna-strand{animation:dnaRotate 6s ease-in-out infinite}.pulse-circle{animation:pulseGlow 4s ease-in-out infinite}.floating-card{animation:floatCard 5s ease-in-out infinite}.badge-text,.subtitle-text,.title-text{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title-text{font-weight:800;fill:#fff}.subtitle-text{font-weight:400;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#00f2fe}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".05"><path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200"/><path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360 M600 0 V360 M700 0 V360 M800 0 V360 M900 0 V360 M1000 0 V360 M1100 0 V360"/></g><circle cx="150" cy="80" r="180" fill="#00f2fe" class="pulse-circle" filter="url(#glow)" opacity=".12"/><circle cx="1050" cy="280" r="200" fill="#7f00ff" class="pulse-circle" filter="url(#glow)" opacity=".15"/><g class="floating-card" filter="url(#softShadow)" transform="translate(60, 40)"><rect width="280" height="280" x="0" y="0" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" stroke-width="1.5" rx="16"/><g><g class="dna-strand" filter="url(#glow)" transform="translate(50, 40)"><path fill="none" stroke="url(#cyanGlow)" stroke-width="4" d="M 40 20 Q 90 60 140 20 T 240 20"/><path fill="none" stroke="url(#dnaGrad)" stroke-width="4" d="M 40 100 Q 90 60 140 100 T 240 100"/><line x1="60" x2="60" y1="32" y2="88" stroke="#fff" stroke-opacity=".4" stroke-width="2"/><line x1="90" x2="90" y1="60" y2="60" stroke="#fff" stroke-linecap="round" stroke-opacity=".8" stroke-width="4"/><line x1="120" x2="120" y1="32" y2="88" stroke="#fff" stroke-opacity=".4" stroke-width="2"/><line x1="150" x2="150" y1="20" y2="100" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><line x1="180" x2="180" y1="32" y2="88" stroke="#fff" stroke-opacity=".4" stroke-width="2"/><line x1="210" x2="210" y1="60" y2="60" stroke="#fff" stroke-linecap="round" stroke-opacity=".8" stroke-width="4"/></g><g transform="translate(50, 40) translate(45, 110)"><rect width="90" height="110" x="0" y="0" fill="#0f172a" stroke="url(#cyanGlow)" stroke-width="2" rx="8"/><line x1="18" x2="72" y1="25" y2="25" stroke="#94a3b8" stroke-linecap="round" stroke-width="3"/><line x1="18" x2="60" y1="42" y2="42" stroke="#64748b" stroke-linecap="round" stroke-width="3"/><line x1="18" x2="68" y1="59" y2="59" stroke="#64748b" stroke-linecap="round" stroke-width="3"/><circle cx="45" cy="88" r="14" fill="#10b981"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M39 88 L43 92 L51 84"/></g></g></g><g><g transform="translate(380, 75) translate(0, 0)"><rect width="290" height="32" x="0" y="0" fill="#00f2fe" fill-opacity=".1" stroke="#00f2fe" stroke-opacity=".4" stroke-width="1.5" rx="16"/><text x="16" y="21" class="badge-text">🧬 GxP &amp; REGULATED COMPLIANCE</text></g><text x="0" y="82" class="title-text" font-size="38" letter-spacing="-.5" transform="translate(380, 75)">Awesome Life Sciences</text><text x="0" y="128" fill="url(#cyanGlow)" class="title-text" filter="url(#glow)" font-size="36" transform="translate(380, 75)">Document Management</text><text x="0" y="172" class="subtitle-text" font-size="16" line-height="24" transform="translate(380, 75)"><tspan x="0" dy="0">Curated eQMS, GxP Document Control, Electronic Signatures,</tspan> <tspan x="0" dy="24">SOP Management &amp; Open-Source Life Science Software Platforms.</tspan></text><g transform="translate(380, 75) translate(0, 220)"><rect width="125" height="28" x="0" y="0" fill="#fff" fill-opacity=".06" rx="6"/><text x="12" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">🔒 21 CFR Part 11</text><rect width="115" height="28" x="137" y="0" fill="#fff" fill-opacity=".06" rx="6"/><text x="149" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">📋 ISO 13485</text><rect width="125" height="28" x="264" y="0" fill="#fff" fill-opacity=".06" rx="6"/><text x="276" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">🧪 Open-Source</text><rect width="110" height="28" x="401" y="0" fill="#fff" fill-opacity=".06" rx="6"/><text x="413" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">☁️ Enterprise</text></g></g></svg>