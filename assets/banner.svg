<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#101f42"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters for CSS/SVG animations and glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes dnaRotate {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .dna-strand { animation: dnaRotate 6s ease-in-out infinite; }
    .pulse-circle { animation: pulseGlow 4s ease-in-out infinite; }
    .floating-card { animation: floatCard 5s ease-in-out infinite; }
    .animated-border { stroke-dasharray: 8 8; animation: dashMove 3s linear infinite; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #00f2fe; }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200"/>
    <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360 M600 0 V360 M700 0 V360 M800 0 V360 M900 0 V360 M1000 0 V360 M1100 0 V360"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="#00f2fe" opacity="0.12" filter="url(#glow)" class="pulse-circle"/>
  <circle cx="1050" cy="280" r="200" fill="#7f00ff" opacity="0.15" filter="url(#glow)" class="pulse-circle"/>

  <!-- Left Hero Decorative Graphics: Regulated Document Stack & Helix -->
  <g transform="translate(60, 40)" class="floating-card" filter="url(#softShadow)">
    <!-- Glassmorphic Card Background -->
    <rect x="0" y="0" width="280" height="280" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    
    <!-- Central Document Shield/Icon -->
    <g transform="translate(50, 40)">
      <!-- DNA Double Helix SVG Path -->
      <g class="dna-strand" filter="url(#glow)">
        <!-- Helix Strand 1 -->
        <path d="M 40 20 Q 90 60 140 20 T 240 20" fill="none" stroke="url(#cyanGlow)" stroke-width="4"/>
        <!-- Helix Strand 2 -->
        <path d="M 40 100 Q 90 60 140 100 T 240 100" fill="none" stroke="url(#dnaGrad)" stroke-width="4"/>
        
        <!-- Base Pairs -->
        <line x1="60" y1="32" x2="60" y2="88" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
        <line x1="90" y1="60" x2="90" y2="60" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round"/>
        <line x1="120" y1="32" x2="120" y2="88" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
        <line x1="150" y1="20" x2="150" y2="100" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
        <line x1="180" y1="32" x2="180" y2="88" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
        <line x1="210" y1="60" x2="210" y2="60" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- Document Symbol with Checkmark -->
      <g transform="translate(45, 110)">
        <rect x="0" y="0" width="90" height="110" rx="8" fill="#0f172a" stroke="url(#cyanGlow)" stroke-width="2"/>
        <line x1="18" y1="25" x2="72" y2="25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
        <line x1="18" y1="42" x2="60" y2="42" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
        <line x1="18" y1="59" x2="68" y2="59" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Verified GxP Badge -->
        <circle cx="45" cy="88" r="14" fill="#10b981"/>
        <path d="M39 88 L43 92 L51 84" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Right Content Area -->
  <g transform="translate(380, 75)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="290" height="32" rx="16" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="16" y="21" class="badge-text">🧬 GxP &amp; REGULATED COMPLIANCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="82" class="title-text" font-size="38" letter-spacing="-0.5">Awesome Life Sciences</text>
    <text x="0" y="128" class="title-text" font-size="36" fill="url(#cyanGlow)" filter="url(#glow)">Document Management</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle-text" font-size="16" line-height="24">
      <tspan x="0" dy="0">Curated eQMS, GxP Document Control, Electronic Signatures,</tspan>
      <tspan x="0" dy="24">SOP Management &amp; Open-Source Life Science Software Platforms.</tspan>
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="125" height="28" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">🔒 21 CFR Part 11</text>

      <rect x="137" y="0" width="115" height="28" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <text x="149" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">📋 ISO 13485</text>

      <rect x="264" y="0" width="125" height="28" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <text x="276" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">🧪 Open-Source</text>

      <rect x="401" y="0" width="110" height="28" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <text x="413" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">☁️ Enterprise</text>
    </g>
  </g>
</svg>
